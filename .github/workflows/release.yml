name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.1
        required: true
        type: string
      publish:
        description: Publish the verified build as a public Release
        type: boolean
        default: false
      skip_tests:
        description: Skip tests for this manually requested run only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and resolve its exact commit
        id: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python -c 'import os,sys; sys.path.insert(0,"scripts/release"); from release import parse_version; parse_version(os.environ["RELEASE_TAG"])'
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.commit }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Validate four distributions and matching source commits
        run: python scripts/release/release.py assemble --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --run-url "$RUN_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: release-complete
          path: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release/publish.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
