name: Desktop build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      skip_tests:
        description: Explicitly authorized release without test execution
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-worker:
    name: Dart worker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Compile architecture-specific pure Dart worker
        working-directory: services/proxy_worker
        run: |
          dart pub get --enforce-lockfile
          dart compile exe bin/main.dart -o neutrino_worker_${{ matrix.arch }}
      - name: Analyze worker
        if: ${{ !inputs.skip_tests }}
        working-directory: services/proxy_worker
        run: dart analyze
      - name: Verify native worker protocol
        if: ${{ !inputs.skip_tests }}
        run: python3 scripts/verify-worker.py --worker services/proxy_worker/neutrino_worker_${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-worker-${{ matrix.arch }}
          path: services/proxy_worker/neutrino_worker_${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: macos-worker
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release.py metadata --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Test release safeguards
        if: ${{ !inputs.skip_tests }}
        run: python -m unittest discover -s scripts/tests -v
      - name: Select OpenSSL 3 on macOS
        if: ${{ runner.os == 'macOS' && !inputs.skip_tests }}
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Generate fresh local TLS test certificates
        if: ${{ !inputs.skip_tests }}
        run: python scripts/generate-test-certificates.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format, analyze and test
        if: ${{ !inputs.skip_tests }}
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build Windows runtime bundle
        if: runner.os == 'Windows'
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: flutter build windows --release --no-pub --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Include Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/copy-windows-runtime.ps1
      - name: Verify worker IPC and parent-exit cleanup
        if: ${{ runner.os == 'Windows' && !inputs.skip_tests }}
        run: |
          python scripts/verify-worker.py --worker build/windows/x64/runner/Release/neutrino_worker.exe
          cmake --build build/windows/x64 --config Release --target neutrino_vault_test neutrino_tray_test
          build/windows/x64/native_host/Release/neutrino_vault_test.exe
          build/windows/x64/native_host/Release/neutrino_tray_test.exe
          python scripts/verify-host-faults.py --bundle build/windows/x64/runner/Release
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS'
        with:
          pattern: macos-worker-*
          path: build/macos-workers
          merge-multiple: true
      - name: Build universal macOS app with ad-hoc signing
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
        run: |
          flutter config --no-enable-macos-arm64-only
          flutter build macos --release --no-pub --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          bash scripts/build-macos-host.sh
      - name: Package and record artifacts
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -File scripts/package-windows.ps1 -Tag "$RELEASE_TAG" -BuildNumber "$GITHUB_RUN_NUMBER"
          else
            bash scripts/package-macos.sh "$RELEASE_TAG"
          fi
          python scripts/release.py record --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --build-number "$GITHUB_RUN_NUMBER" --platform "$BUILD_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
