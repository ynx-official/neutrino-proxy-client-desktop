name: neutrino_proxy_client_desktop
description: Neutrino Proxy desktop client with a pure Dart protocol engine.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  window_manager: 0.5.2
  file_selector: 1.1.0
  crypto: 3.0.7
  yaml: 3.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/tray.ico
    - assets/tray.png
    - assets/test.jks
